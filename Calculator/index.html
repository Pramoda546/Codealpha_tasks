<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Advanced Calculator</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
        body{display:flex;height:100vh;background:#1e1e2f;color:white}
        .container{display:flex;margin:auto;gap:20px}
        .calculator{background:rgba(255,255,255,0.05);padding:20px;border-radius:20px;width:300px}
        .display{height:60px;background:#000;border-radius:10px;margin-bottom:10px;padding:10px;font-size:24px;text-align:right}
        .buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
        button{padding:15px;border:none;border-radius:10px;background:#333;color:white;font-size:18px;cursor:pointer}
        button:hover{background:#555}
        .operator{background:#ff9500}
        .equal{background:#00c853;grid-column:span 2}
        .clear{background:#ff3d00}

        .history{
            width:220px;
            background:rgba(255,255,255,0.05);
            padding:15px;
            border-radius:20px;
            overflow-y:auto;
        }

        .history h3{
            text-align:center;
            margin-bottom:10px;
        }

        /* NEW CLEAR HISTORY BUTTON */
        .clear-history-btn {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: none;
            border-radius: 10px;
            background: #ff3d00;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        .clear-history-btn:hover {
            background: #ff1744;
        }

        .history-item{
            font-size:14px;
            margin-bottom:5px;
            border-bottom:1px solid rgba(255,255,255,0.1);
            padding-bottom:5px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .delete-btn{
            background:none;
            color:white;
            border:none;
            cursor:pointer;
            font-size:18px;
            padding:5px;
        }

        .delete-btn:hover{
            color:#ff3d00;
        }

        .delete-btn svg{
            width:16px;
            height:16px;
        }
    </style>
</head>

<body>
<div class="container">

    <!-- CALCULATOR -->
    <div class="calculator">
        <div id="display" class="display">0</div>

        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="deleteLast()">⌫</button>
            <button onclick="append('%')">%</button>
            <button class="operator" onclick="append('/')">÷</button>

            <button onclick="append('7')">7</button>
            <button onclick="append('8')">8</button>
            <button onclick="append('9')">9</button>
            <button class="operator" onclick="append('*')">×</button>

            <button onclick="append('4')">4</button>
            <button onclick="append('5')">5</button>
            <button onclick="append('6')">6</button>
            <button class="operator" onclick="append('-')">−</button>

            <button onclick="append('1')">1</button>
            <button onclick="append('2')">2</button>
            <button onclick="append('3')">3</button>
            <button class="operator" onclick="append('+')">+</button>

            <button onclick="append('0')">0</button>
            <button onclick="append('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>
        </div>
    </div>

    <!-- HISTORY PANEL -->
    <div class="history">
        <h3>History</h3>

        <!-- NEW BUTTON -->
        <button class="clear-history-btn" onclick="clearHistory()">Clear All</button>

        <div id="historyList"></div>
    </div>

</div>

<audio id="clickSound" src="https://www.soundjay.com/buttons/sounds/button-16.mp3"></audio>
<audio id="resultSound" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>

<script>
let display = document.getElementById("display");
let historyList = document.getElementById("historyList");
let clickSound = document.getElementById("clickSound");
let resultSound = document.getElementById("resultSound");

function playClick() {
    clickSound.currentTime = 0;
    clickSound.play();
}

function append(value) {
    playClick();
    if (display.innerText === "0") display.innerText = value;
    else display.innerText += value;
}

function clearDisplay() {
    playClick();
    display.innerText = "0";
}

function deleteLast() {
    playClick();
    display.innerText = display.innerText.slice(0, -1) || "0";
}

function calculate() {
    try {
        let expression = display.innerText;
        let result = eval(expression);
        display.innerText = result;
        addToHistory(expression + " = " + result);
        resultSound.play();
    } catch {
        display.innerText = "Error";
    }
}

function addToHistory(entry) {
    let div = document.createElement("div");
    div.className = "history-item";

    div.innerHTML = `
        ${entry}
        <button class="delete-btn" onclick="deleteHistoryItem(this)">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
    `;

    historyList.prepend(div);
}

function deleteHistoryItem(button) {
    button.parentElement.remove();
}

/* NEW FUNCTION */
function clearHistory() {
    if (confirm("Are you sure you want to clear all history?")) {
        historyList.innerHTML = "";
    }
}

/* KEYBOARD SUPPORT */
document.addEventListener("keydown", function (e) {
    let key = e.key;

    if (!isNaN(key) || "+-*/.%".includes(key)) append(key);
    else if (key === "Enter") calculate();
    else if (key === "Backspace") deleteLast();
    else if (key.toLowerCase() === "c") clearDisplay();
});
</script>

</body>
</html>
